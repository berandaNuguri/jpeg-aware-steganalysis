dataset_class:
  train: PairedPatchDataset
  validation: PairedPatchDataset
  test: PairedPatchDataset

train_transforms:
  - name: ToPILImage
  # - name: RandomHorizontalFlip
  #   p: 0.5
  # - name: RandomVerticalFlip
  #   p: 0.5
  - name: ToTensor
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

test_transforms:
  - name: ToPILImage
  - name: ToTensor
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]